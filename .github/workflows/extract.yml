name: Extract Chauffeur App

on:
  push:
    branches:
      - main
    paths:
      - "Chauffeur-ready.zip"
      - ".github/workflows/extract.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf /tmp/chauffeur
          mkdir -p /tmp/chauffeur
          unzip -o Chauffeur-ready.zip -d /tmp/chauffeur

          if [ -d /tmp/chauffeur/Chauffeur-v2 ]; then
            SRC=/tmp/chauffeur/Chauffeur-v2
          elif [ -d /tmp/chauffeur/Chauffeur ]; then
            SRC=/tmp/chauffeur/Chauffeur
          else
            SRC=/tmp/chauffeur
          fi

          find "$SRC" -mindepth 1 -maxdepth 1 ! -name '.github' -exec cp -R {} . \;

          rm -f Chauffeur-ready.zip

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Chauffeur application" || exit 0
          git push
