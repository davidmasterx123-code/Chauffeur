name: Extract Chauffeur App

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/extract.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o Chauffeur-ready.zip -d /tmp/chauffeur
          cp -R /tmp/chauffeur/Chauffeur/. .
          rm -f Chauffeur-ready.zip
          rm -f styles.css

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Chauffeur application" || exit 0
          git push
